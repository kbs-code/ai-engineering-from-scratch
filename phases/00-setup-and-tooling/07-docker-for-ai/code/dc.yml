services:
  ai_dev_3-14:
    build:
      context: .
      dockerfile: df_3-14 
    volumes:
      - ../../../:/workspace
      - ~/models:/models
      - ~/datasets:/data
    ports:
      - "8888:8888"
      - "5000:5000"
    working_dir: /workspace/00-setup-and-tooling/07-docker-for-ai/code
    stdin_open: true
    tty: true
    command: flask --app app run --host=0.0.0.0 --port=5000


  qdrant:
    image: qdrant/qdrant:v1.12.5
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data: